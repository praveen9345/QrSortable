name: MAUI iOS Unsigned Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      # 1. Force .NET 9 SDK via global.json to stop the SDK 10 preview from asking for Tizen
      - name: Setup .NET 9 and Pin Version
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Create global.json
        run: |
          echo '{
            "sdk": {
              "version": "9.0.100",
              "rollForward": "latestFeature"
            }
          }' > QrSortable/global.json

      # 2. Install the specific workloads required
      - name: Install Workloads
        run: |
          cd QrSortable
          dotnet workload install maui-ios --ignore-failed-sources
        working-directory: QrSortable

      # 3. Restore with specific TargetFramework property
      - name: Restore dependencies
        run: dotnet restore QrSortable.csproj /p:TargetFramework=net9.0-ios
        working-directory: QrSortable

      # 4. Build with the bypass flags for actool
      - name: Build iOS app (unsigned)
        run: |
          dotnet publish QrSortable.csproj \
            -f net9.0-ios \
            -c Release \
            /p:BuildIpa=true \
            /p:EnableCodeSigning=false \
            /p:CodesignKey="-" \
            /p:CodesignProvision="-" \
            /p:ArchiveOnBuild=true \
            /p:OptimizePNGs=false \
            /p:UseAccessorizer=false \
            /p:RuntimeIdentifier=ios-arm64 \
            /p:ForceSimulatorRuntimeSelection=false
        working-directory: QrSortable

      # 5. Create the IPA manual package
      - name: Package Unsigned IPA
        run: |
          cd QrSortable/bin/Release/net9.0-ios/ios-arm64/publish/
          mkdir -p Payload
          cp -R QrSortable.app Payload/
          zip -qr QrSortable-Unsigned.ipa Payload
          mv QrSortable-Unsigned.ipa ${{ github.workspace }}/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QrSortable-Unsigned-IPA
          path: QrSortable-Unsigned.ipa

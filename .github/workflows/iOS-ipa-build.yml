name: MAUI iOS Unsigned IPA Build

on:
  workflow_dispatch: # Manual trigger only

jobs:
  build-ios:
    name: 🎉 MAUI iOS Build (Unsigned)
    runs-on: macos-latest

    steps:
      # 1️⃣ Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Select specific Xcode version
      # Sometimes "latest" defaults to a version slightly behind what the SDK expects
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Check Xcode version
        run: xcodebuild -version

      # 3️⃣ Setup .NET 9
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 4️⃣ Install Compatible .NET 9 MAUI Workloads
      - name: Install compatible MAUI workloads
        run: |
          # Pining to 9.0.100 to avoid the "Xcode 26" metadata error in 9.0.3xx
          echo '{
            "sdk": {
              "version": "9.0.100",
              "workloadVersion": "9.0.100",
              "allowPrerelease": false,
              "rollForward": "latestFeature"
            }
          }' > global.json

          dotnet workload config --update-mode workload-set
          dotnet workload install maui-ios maui-maccatalyst --version 9.0.100
          dotnet workload list

      # 5️⃣ Restore NuGet packages
      - name: Restore NuGet packages
        run: dotnet restore QrSortable.csproj
        working-directory: QrSortable

      # 6️⃣ Build the unsigned iOS app
      # Using -p:EnableCodeSigning=false is the modern way to skip signing
      - name: Build iOS app (unsigned)
        run: |
          dotnet publish QrSortable.csproj \
            -f net9.0-ios \
            -c Release \
            /p:BuildIpa=true \
            /p:PublishTrimmed=true \
            /p:PublishReadyToRun=false \
            /p:EnableCodeSigning=false \
            /p:CodesignKey="-" \
            /p:CodesignProvision="-"
        working-directory: QrSortable

      # 7️⃣ Prepare Payload folder and create the final .ipa file
      - name: Package unsigned IPA
        run: |
          # Navigate to the output directory
          cd QrSortable/bin/Release/net9.0-ios/ios-arm64/publish/
          
          # Create IPA structure
          mkdir -p Payload
          cp -R QrSortable.app Payload/
          zip -qr QrSortable-Unsigned.ipa Payload
          
          # Move to root for easier artifact upload
          mv QrSortable-Unsigned.ipa $GITHUB_WORKSPACE/

      # 8️⃣ Upload the generated .ipa file as a workflow artifact
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QrSortable-Unsigned-IPA
          path: QrSortable-Unsigned.ipa

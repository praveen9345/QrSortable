name: MAUI iOS Unsigned IPA Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 MAUI iOS Build (Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4






      - name: Check available Xcode versions



        run: |
          ls -la /Applications/ | grep Xcode
          
      - name: Set Xcode version (prefer 15.x)
        run: |
          # Try Xcode 15 versions first
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
            echo "Using Xcode 15.4"
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
            echo "Using Xcode 15.3"
          elif [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
            echo "Using Xcode 15.2"
          else
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
            echo "Using Xcode 16 (fallback)"
          fi

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workloads
        run: |
          # Create global.json in the project folder to fix the SDK version
          echo '{
            "sdk": {
              "version": "9.0.100",
              "workloadVersion": "9.0.100",
              "allowPrerelease": false,
              "rollForward": "latestFeature"
            }
          }' > QrSortable/global.json

          cd QrSortable
          dotnet workload restore
          dotnet workload list

      - name: Clean previous builds
        run: |
          rm -rf QrSortable/bin QrSortable/obj
          
      - name: Restore NuGet packages
        run: dotnet restore QrSortable.csproj
        working-directory: QrSortable


      - name: Build iOS app (unsigned)

        run: |
          dotnet publish QrSortable.csproj \
            -f net9.0-ios \
            -c Release \
            -r ios-arm64 \

            /p:BuildIpa=true \
            /p:EnableCodeSigning=false \
            /p:CodesignKey="-" \
            /p:CodesignProvision="-" \
            /p:ArchiveOnBuild=true \

            /p:OptimizePNGs=false \
            /p:UseAccessorizer=false \
            /p:MtouchNoFastDev=true \
            /p:MtouchTarget=device \
            /p:TargetDevice=iPhone \
            /p:Platform=iPhone \
            /p:SuppressMtouchSimulatorWarnings=true
        working-directory: QrSortable

      - name: Package unsigned IPA
        run: |
          # Use find to locate the .app safely
          APP_PATH=$(find QrSortable/bin/Release/net9.0-ios/ios-arm64/publish -name "*.app" -type d | head -n 1)






          echo "Found app at: $APP_PATH"
          
          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"
          
          mkdir -p Payload
          cp -R *.app Payload/
          zip -qr QrSortable-Unsigned.ipa Payload
          mv QrSortable-Unsigned.ipa ${{ github.workspace }}/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QrSortable-Unsigned-IPA
          path: QrSortable-Unsigned.ipa

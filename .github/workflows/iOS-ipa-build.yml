name: MAUI iOS Unsigned IPA Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 MAUI iOS Build (Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Ensure we use a stable Xcode 16 environment
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install compatible MAUI workloads
        run: |
          echo '{
            "sdk": {
              "version": "9.0.100",
              "workloadVersion": "9.0.100",
              "allowPrerelease": false,
              "rollForward": "latestFeature"
            }
          }' > QrSortable/global.json

          cd QrSortable
          dotnet workload config --update-mode workload-set
          dotnet workload restore
          dotnet workload install maui-ios maui-maccatalyst
          dotnet workload list

      - name: Restore NuGet packages
        run: dotnet restore QrSortable.csproj
        working-directory: QrSortable

      # 6️⃣ Build with specific flags to bypass actool/simulator errors
      - name: Build iOS app (unsigned)
        run: |
          dotnet publish QrSortable.csproj \
            -f net9.0-ios \
            -c Release \
            /p:BuildIpa=true \
            /p:EnableCodeSigning=false \
            /p:CodesignKey="-" \
            /p:CodesignProvision="-" \
            /p:ArchiveOnBuild=true \
            /p:IsAppExtension=false \
            /p:MtouchNoFastDev=true \
            /p:ForceSimulatorRuntimeSelection=false
        working-directory: QrSortable

      # 7️⃣ Packaging Step
      - name: Package unsigned IPA
        run: |
          # Robust way to find the .app even if paths shift
          APP_PATH=$(find QrSortable/bin/Release/net9.0-ios -name "QrSortable.app" -type d | head -n 1)
          echo "App found at: $APP_PATH"
          
          # Get the directory where the .app lives
          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"
          
          mkdir -p Payload
          cp -R "QrSortable.app" Payload/
          zip -qr QrSortable-Unsigned.ipa Payload
          
          # Move to the workspace root so the next step can find it
          mv QrSortable-Unsigned.ipa $GITHUB_WORKSPACE/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QrSortable-Unsigned-IPA
          path: QrSortable-Unsigned.ipa

name: MAUI iOS Unsigned IPA Build

on:
  workflow_dispatch: # Manual trigger only

jobs:
  build-ios:
    name: 🎉 MAUI iOS Build (Unsigned)
    runs-on: macos-latest

    steps:
      # 1️⃣ Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Check Xcode version (for debugging/verification)
      - name: Check Xcode version
        run: xcodebuild -version

      # 3️⃣ Setup .NET 9
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 4️⃣ Install MAUI workloads with compatible iOS SDK
      - name: Install compatible MAUI workloads
        run: |
          # First install MAUI workload
          dotnet workload install maui
          
          # Check installed iOS SDK version
          echo "Checking current iOS SDK version..."
          dotnet workload list
          
          # The issue is that the latest .NET 9 iOS SDK requires Xcode 26.0
          # Since we have Xcode 16.4, we need to use an older iOS SDK version
          # that was validated against Xcode 16.4
          
          # Uninstall the problematic iOS SDK that requires Xcode 26.0
          dotnet workload uninstall ios
          
          # Install a compatible iOS SDK version
          # Version 26.0.0-preview.9 was the last preview before Xcode 26.0 requirement
          dotnet workload install ios --version 26.0.0-preview.9

      # 5️⃣ Restore NuGet packages
      - name: Restore NuGet packages
        run: dotnet restore QrSortable.csproj
        working-directory: QrSortable

      # 6️⃣ Build the unsigned iOS app (IPA)
      - name: Build iOS app (unsigned)
        run: |
          dotnet publish QrSortable.csproj \
            -f net9.0-ios \
            -c Release \
            /p:BuildIpa=true \
            /p:PublishTrimmed=true \
            /p:PublishReadyToRun=false \
            /p:CodesignKey="" \
            /p:CodesignProvision=""
        working-directory: QrSortable

      # 7️⃣ Prepare Payload folder and create the final .ipa file
      - name: Package unsigned IPA
        run: |
          cd QrSortable/bin/Release/net9.0-ios/ios-arm64/publish
          mkdir -p Payload
          mv QrSortable.app Payload/
          zip -qr QrSortable-Unsigned.ipa Payload

      # 8️⃣ Upload the generated .ipa file as a workflow artifact
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QrSortable-Unsigned-IPA
          path: QrSortable/bin/Release/net9.0-ios/ios-arm64/publish/QrSortable-Unsigned.ipa

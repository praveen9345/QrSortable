name: MAUI iOS Unsigned IPA Build

on:
  workflow_dispatch: # Manual trigger only

jobs:
  build-ios:
    name: 🎉 MAUI iOS Build (Unsigned)
    runs-on: macos-latest

    steps:
      # 1️⃣ Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Select specific Xcode version
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Check Xcode version
        run: xcodebuild -version

      # 3️⃣ Setup .NET 9
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 4️⃣ Install Compatible .NET 9 MAUI Workloads
      - name: Install compatible MAUI workloads
        run: |
          # Create global.json inside the project folder to pin the version
          echo '{
            "sdk": {
              "version": "9.0.100",
              "workloadVersion": "9.0.100",
              "allowPrerelease": false,
              "rollForward": "latestFeature"
            }
          }' > QrSortable/global.json

          # Set mode to workload-set
          dotnet workload config --update-mode workload-set

          # Install workloads (CLI reads version from global.json automatically)
          dotnet workload install maui-ios maui-maccatalyst
          
          dotnet workload list

      # 5️⃣ Restore NuGet packages
      - name: Restore NuGet packages
        run: dotnet restore QrSortable.csproj
        working-directory: QrSortable

      # 6️⃣ Build the unsigned iOS app
      - name: Build iOS app (unsigned)
        run: |
          dotnet publish QrSortable.csproj \
            -f net9.0-ios \
            -c Release \
            /p:BuildIpa=true \
            /p:PublishTrimmed=true \
            /p:PublishReadyToRun=false \
            /p:EnableCodeSigning=false \
            /p:CodesignKey="-" \
            /p:CodesignProvision="-"
        working-directory: QrSortable

      # 7️⃣ Package unsigned IPA
      - name: Package unsigned IPA
        run: |
          # Find the .app bundle dynamically in case the path differs slightly
          APP_PATH=$(find QrSortable/bin/Release/net9.0-ios -name "QrSortable.app" -type d | head -n 1)
          APP_DIR=$(dirname "$APP_PATH")
          
          cd "$APP_DIR"
          mkdir -p Payload
          cp -R "QrSortable.app" Payload/
          zip -qr QrSortable-Unsigned.ipa Payload
          
          # Move to workspace root for upload
          mv QrSortable-Unsigned.ipa $GITHUB_WORKSPACE/

      # 8️⃣ Upload the generated .ipa file
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QrSortable-Unsigned-IPA
          path: QrSortable-Unsigned.ipa

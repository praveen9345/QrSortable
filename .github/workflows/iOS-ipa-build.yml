name: MAUI iOS Unsigned IPA Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 MAUI iOS Build (Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Force Xcode 16.1 or 16.0 to ensure compatibility with .NET 9
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workloads
        run: |
          # Create global.json in the project folder
          echo '{
            "sdk": {
              "version": "9.0.100",
              "workloadVersion": "9.0.100",
              "allowPrerelease": false,
              "rollForward": "latestFeature"
            }
          }' > QrSortable/global.json

          cd QrSortable
          dotnet workload config --update-mode workload-set
          dotnet workload restore
          dotnet workload install maui-ios
          dotnet workload list

      - name: Restore NuGet packages
        run: dotnet restore QrSortable.csproj
        working-directory: QrSortable

      # 6️⃣ Build with "Emergency" flags to bypass actool/simulator runtime checks
      - name: Build iOS app (unsigned)
        run: |
          dotnet publish QrSortable.csproj \
            -f net9.0-ios \
            -c Release \
            /p:BuildIpa=true \
            /p:EnableCodeSigning=false \
            /p:CodesignKey="-" \
            /p:CodesignProvision="-" \
            /p:ArchiveOnBuild=true \
            /p:ForceSimulatorRuntimeSelection=false \
            /p:IsAppExtension=false \
            /p:OptimizePNGs=false \
            /p:MtouchLink=SdkOnly \
            /p:MtouchNoFastDev=true
        working-directory: QrSortable

      # 7️⃣ Packaging Step
      - name: Package unsigned IPA
        run: |
          # Navigate to the output directory
          cd QrSortable/bin/Release/net9.0-ios/ios-arm64/publish/
          
          mkdir -p Payload
          cp -R QrSortable.app Payload/
          zip -qr QrSortable-Unsigned.ipa Payload
          
          mv QrSort

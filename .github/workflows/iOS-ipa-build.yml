name: MAUI iOS Unsigned Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 1. Install ONLY the iOS workload
      - name: Install iOS Workload
        run: dotnet workload install ios --ignore-failed-sources

      # 2. Corrected Restore: Use /p:TargetFramework instead of -f to avoid MSB1008
      - name: Restore dependencies
        run: dotnet restore QrSortable.csproj /p:TargetFramework=net9.0-ios
        working-directory: QrSortable

      # 3. Publish with bypass flags for actool
      - name: Build iOS app (unsigned)
        run: |
          dotnet publish QrSortable.csproj \
            -f net9.0-ios \
            -c Release \
            /p:BuildIpa=true \
            /p:EnableCodeSigning=false \
            /p:CodesignKey="-" \
            /p:CodesignProvision="-" \
            /p:ArchiveOnBuild=true \
            /p:OptimizePNGs=false \
            /p:UseAccessorizer=false \
            /p:RuntimeIdentifier=ios-arm64 \
            /p:ForceSimulatorRuntimeSelection=false
        working-directory: QrSortable

      # 4. Create the IPA manual package
      - name: Package Unsigned IPA
        run: |
          # Ensuring we are in the correct output directory
          cd QrSortable/bin/Release/net9.0-ios/ios-arm64/publish/
          mkdir -p Payload
          cp -R QrSortable.app Payload/
          zip -qr QrSortable-Unsigned.ipa Payload
          mv QrSortable-Unsigned.ipa ${{ github.workspace }}/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QrSortable-Unsigned-IPA
          path: QrSortable-Unsigned.ipa

name: MAUI iOS Unsigned IPA Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 MAUI iOS Build (Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.100'

      - name: Check available Xcode versions
        run: |
          echo "=== xcodebuild -version ==="
          xcodebuild -version || true
          echo "=== /Applications listing ==="
          ls -la /Applications | grep Xcode || true

      - name: Create global.json (repo root) and restore MAUI workloads
        run: |
          cat > global.json <<'JSON'
          {
            "sdk": {
              "version": "9.0.100",
              "allowPrerelease": false,
              "rollForward": "latestFeature"
            }
          }
          JSON
          cd QrSortable
          dotnet workload restore
          dotnet workload list

      - name: Clean previous builds
        run: rm -rf QrSortable/bin QrSortable/obj

      - name: Restore NuGet packages
        working-directory: QrSortable
        run: dotnet restore QrSortable.csproj

      - name: Diagnostics: dotnet and workloads
        working-directory: QrSortable
        run: |
          echo "=== dotnet --info ==="
          dotnet --info || true
          echo "=== dotnet workload list (detailed) ==="
          dotnet workload list || true

      - name: Publish iOS app (unsigned)
        working-directory: QrSortable
        run: |
          dotnet publish QrSortable.csproj \
            -f net9.0-ios \
            -c Release \
            -r ios-arm64 \
            -o bin/Release/net9.0-ios/ios-arm64/publish \
            /p:BuildIpa=true \
            /p:ArchiveOnBuild=true \
            /p:EnableCodeSigning=false \
            /p:OptimizePNGs=false \
            /p:UseAccessorizer=false

      - name: Package unsigned IPA
        run: |
          PUBLISH_DIR=QrSortable/bin/Release/net9.0-ios/ios-arm64/publish
          echo "Looking for .app in $PUBLISH_DIR"
          APP_PATH=$(find "$PUBLISH_DIR" -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found in $PUBLISH_DIR"
            ls -la "$PUBLISH_DIR" || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          rm -rf Payload
          mkdir -p Payload
          cp -R *.app Payload/
          zip -qr QrSortable-Unsigned.ipa Payload
          mv QrSortable-Unsigned.ipa ${{ github.workspace }}/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QrSortable-Unsigned-IPA
          path: QrSortable-Unsigned.ipa
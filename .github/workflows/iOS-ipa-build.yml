name: MAUI iOS Unsigned Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest # Using latest to get Xcode 16/iOS 18 SDK
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Steven's guide emphasizes matching Xcode versions
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui-ios

      - name: Restore
        run: dotnet restore QrSortable.csproj
        working-directory: QrSortable

      # 6️⃣ The "Thewissen-Style" Publish with actool fixes
      - name: Build iOS app
        run: |
          dotnet publish QrSortable.csproj \
            -f net9.0-ios \
            -c Release \
            /p:BuildIpa=true \
            /p:EnableCodeSigning=false \
            /p:CodesignKey="-" \
            /p:CodesignProvision="-" \
            /p:OptimizePNGs=false \
            /p:UseAccessorizer=false \
            /p:MtouchLink=SdkOnly
        working-directory: QrSortable

      # 7️⃣ Packaging (Using the path logic from the guide)
      - name: Package IPA
        run: |
          # The RuntimeIdentifier in csproj puts the app in ios-arm64/publish
          cd QrSortable/bin/Release/net9.0-ios/ios-arm64/publish/
          mkdir -p Payload
          cp -R QrSortable.app Payload/
          zip -qr QrSortable-Unsigned.ipa Payload
          mv QrSortable-Unsigned.ipa ${{ github.workspace }}/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QrSortable-iOS-IPA
          path: QrSortable-Unsigned.ipa

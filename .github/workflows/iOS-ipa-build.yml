name: MAUI iOS Unsigned IPA Build

on:
  workflow_dispatch: # Manual trigger only

jobs:
  build-ios:
    name: 🎉 MAUI iOS Build (Unsigned)
    runs-on: macos-latest

    steps:
      # 1️⃣ Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Select Xcode 16 (matches .NET 9 requirements)
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      # 3️⃣ Setup .NET 9
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 4️⃣ Install Compatible .NET 9 MAUI Workloads
      - name: Install MAUI workloads
        run: |
          # Pinning to a stable workload set to avoid SDK version mismatches
          echo '{
            "sdk": {
              "version": "9.0.100",
              "workloadVersion": "9.0.100",
              "allowPrerelease": false,
              "rollForward": "latestFeature"
            }
          }' > QrSortable/global.json

          cd QrSortable
          dotnet workload config --update-mode workload-set
          dotnet workload restore
          dotnet workload install maui-ios
          dotnet workload list

      # 5️⃣ Restore NuGet packages
      - name: Restore NuGet packages
        run: dotnet restore QrSortable.csproj
        working-directory: QrSortable

      # 6️⃣ Build the unsigned iOS app
      # We no longer need many /p: flags because they are in your .csproj
      - name: Build iOS app (unsigned)
        run: |
          dotnet publish QrSortable.csproj \
            -f net9.0-ios \
            -c Release \
            /p:BuildIpa=true \
            /p:EnableCodeSigning=false \
            /p:CodesignKey="-" \
            /p:CodesignProvision="-"
        working-directory: QrSortable

      # 7️⃣ Package into IPA
      # The path is now fixed to 'ios-arm64' thanks to the RuntimeIdentifier in .csproj
      - name: Package unsigned IPA
        run: |
          cd QrSortable/bin/Release/net9.0-ios/ios-arm64/publish/
          
          mkdir -p Payload
          cp -R QrSortable.app Payload/
          zip -qr QrSortable-Unsigned.ipa Payload
          
          # Move result to the root workspace for the upload step
          mv QrSortable-Unsigned.ipa ${{ github.workspace }}/

      # 8️⃣ Upload the generated .ipa file
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QrSortable-Unsigned-IPA
          path: QrSortable-Unsigned.ipa

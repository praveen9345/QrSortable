name: MAUI iOS Unsigned IPA Build

on:
  workflow_dispatch: # Manual trigger only

jobs:
  build-ios:
    name: 🎉 MAUI iOS Build (Unsigned)
    runs-on: macos-latest

    steps:
      # 1️⃣ Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Install the specific Xcode version required by .NET 9 iOS
      - name: Install Xcode 26.0.1
        run: |
          # Clean up any previous partial installs
          sudo rm -rf /Applications/Xcode_26.app
          sudo rm -f xcode.xip
          
          # **IMPORTANT:** The direct Apple link below may require authentication.
          # If the download fails, manually download Xcode_26.0.1.xip from
          # https://developer.apple.com/download/all/, host it, and replace the URL.
          echo "Downloading Xcode 26.0.1 (this is a large file ~8GB)..."
          curl -L -o xcode.xip "https://developer.apple.com/services-account/download?path=/Developer_Tools/Xcode_26.0.1/Xcode_26.0.1.xip"
          
          echo "Extracting Xcode. This will take 10-15 minutes..."
          xip -x xcode.xip
          
          echo "Moving Xcode to Applications folder..."
          sudo mv Xcode.app /Applications/Xcode_26.app
          
          # Set this Xcode as active and accept license
          echo "Configuring Xcode..."
          sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          sudo xcodebuild -license accept

      # 3️⃣ Setup .NET 9
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 4️⃣ Install MAUI workloads
      - name: Install MAUI workloads
        run: dotnet workload install maui

      # 5️⃣ Restore NuGet packages
      - name: Restore NuGet packages
        run: dotnet restore QrSortable.csproj
        working-directory: QrSortable  # Adjust if your project is in a different folder

      # 6️⃣ Build the unsigned iOS app (IPA)
      - name: Build iOS app (unsigned)
        run: |
          dotnet publish QrSortable.csproj \
            -f net9.0-ios \
            -c Release \
            /p:BuildIpa=true \
            /p:PublishTrimmed=true \
            /p:PublishReadyToRun=false \
            /p:CodesignKey="" \
            /p:CodesignProvision=""
        working-directory: QrSortable

      # 7️⃣ Prepare Payload folder and create the final .ipa file
      - name: Package unsigned IPA
        run: |
          cd QrSortable/bin/Release/net9.0-ios/ios-arm64/publish
          mkdir -p Payload
          mv QrSortable.app Payload/
          zip -qr QrSortable-Unsigned.ipa Payload

      # 8️⃣ Upload the generated .ipa file as a workflow artifact
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QrSortable-Unsigned-IPA
          path: QrSortable/bin/Release/net9.0-ios/ios-arm64/publish/QrSortable-Unsigned.ipa

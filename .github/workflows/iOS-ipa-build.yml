name: MAUI iOS Unsigned IPA Build

on:
  workflow_dispatch: # Manual trigger only

jobs:
  build-ios:
    name: 🎉 MAUI iOS Build (Unsigned)
    runs-on: macos-latest

    steps:
      # 1️⃣ Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Check Xcode version (for debugging/verification)
      - name: Check Xcode version
        run: xcodebuild -version

      # 3️⃣ Setup .NET 9
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 4️⃣ Install Compatible .NET 9 MAUI Workloads
      - name: Install compatible MAUI workloads
        run: |
          # Create a global.json file to pin the .NET 9 SDK and workload version
          # This forces the entire build to use a specific, compatible version
          echo '{
            "sdk": {
              "version": "9.0.310",
              "workloadVersion": "9.0.310",
              "allowPrerelease": false,
              "rollForward": "disable"
            }
          }' > global.json

          # Switch workload installation to use "workload sets" (pinned versions)
          dotnet workload config --update-mode workload-set

          # Install the specific MAUI workloads for iOS, Android, and Mac Catalyst
          # These are the correct workload IDs for .NET 9
          dotnet workload install maui-ios maui-android maui-maccatalyst

          # Verify the installed workloads
          dotnet workload list

      # 5️⃣ Restore NuGet packages
      - name: Restore NuGet packages
        run: dotnet restore QrSortable.csproj
        working-directory: QrSortable

      # 6️⃣ Build the unsigned iOS app (IPA)
      - name: Build iOS app (unsigned)
        run: |
          dotnet publish QrSortable.csproj \
            -f net9.0-ios \
            -c Release \
            /p:BuildIpa=true \
            /p:PublishTrimmed=true \
            /p:PublishReadyToRun=false \
            /p:CodesignKey="" \
            /p:CodesignProvision=""
        working-directory: QrSortable

      # 7️⃣ Prepare Payload folder and create the final .ipa file
      - name: Package unsigned IPA
        run: |
          cd QrSortable/bin/Release/net9.0-ios/ios-arm64/publish
          mkdir -p Payload
          mv QrSortable.app Payload/
          zip -qr QrSortable-Unsigned.ipa Payload

      # 8️⃣ Upload the generated .ipa file as a workflow artifact
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QrSortable-Unsigned-IPA
          path: QrSortable/bin/Release/net9.0-ios/ios-arm64/publish/QrSortable-Unsigned.ipa

name: MAUI iOS Unsigned IPA Build
on:
  workflow_dispatch:
jobs:
  build-ios:
    name: 🎉 MAUI iOS Build (Unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --version 9.0.0
      
      - name: Restore NuGet packages
        run: dotnet restore QrSortable.csproj
        working-directory: QrSortable
      
      - name: Build iOS app with explicit SDK version
        run: |
          dotnet publish QrSortable.csproj \
            -f net9.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:BuildIpa=true \
            -p:_XamarinSdkRoot=/Applications/Xcode_16.4.app \
            -p:TargetPlatformVersion=17.5 \
            -p:CodesignKey="" \
            -p:CodesignProvision=""
        working-directory: QrSortable
      
      - name: Prepare Payload folder
        run: |
          cd QrSortable/bin/Release/net9.0-ios/ios-arm64/publish
          mkdir -p Payload
          mv QrSortable.app Payload/
      
      - name: Zip unsigned IPA
        run: |
          cd QrSortable/bin/Release/net9.0-ios/ios-arm64/publish
          zip -qq -r -9 QrSortable-Unsigned.ipa Payload
      
      - name: Upload IPA to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: QrSortable/bin/Release/net9.0-ios/ios-arm64/publish/QrSortable-Unsigned.ipa
          tag: v1.0
          overwrite: true
          body: "Unsigned MAUI IPA for testing only"

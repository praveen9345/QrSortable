name: MAUI iOS Unsigned Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 1. Install ONLY the iOS workload to save time and prevent Android errors
      - name: Install iOS Workload
        run: dotnet workload install ios --ignore-failed-sources

      # 2. Restore ONLY for the iOS target framework
      - name: Restore dependencies
        run: dotnet restore QrSortable.csproj -f net9.0-ios
        working-directory: QrSortable

      # 3. Publish with the 'Nuclear' flags to bypass actool/signing checks
      - name: Build iOS app (unsigned)
        run: |
          dotnet publish QrSortable.csproj \
            -f net9.0-ios \
            -c Release \
            /p:BuildIpa=true \
            /p:EnableCodeSigning=false \
            /p:CodesignKey="-" \
            /p:CodesignProvision="-" \
            /p:ArchiveOnBuild=true \
            /p:OptimizePNGs=false \
            /p:UseAccessorizer=false \
            /p:RuntimeIdentifier=ios-arm64
        working-directory: QrSortable

      # 4. Create the IPA (Since it's unsigned, we package it manually)
      - name: Package Unsigned IPA
        run: |
          cd QrSortable/bin/Release/net9.0-ios/ios-arm64/publish/
          mkdir -p Payload
          cp -R QrSortable.app Payload/
          zip -qr QrSortable-Unsigned.ipa Payload
          mv QrSortable-Unsigned.ipa ${{ github.workspace }}/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QrSortable-Unsigned-IPA
          path: QrSortable-Unsigned.ipa

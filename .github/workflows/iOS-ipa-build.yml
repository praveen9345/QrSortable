name: MAUI iOS Signed IPA Build

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'QrSortable'
  TARGET_FRAMEWORK: 'net9.0-ios'
  CONFIGURATION: 'Release'

jobs:
  build-ios:
    name: 🎉 MAUI iOS Build (Signed)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ FIX: Always use latest Xcode (iOS 26 SDK)
      - name: Setup Xcode (required for App Store)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Verify Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      # ✅ Clean cache to avoid old SDK artifacts
      - name: Clean Xcode cache
        run: rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/Library/Caches/NuGet
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ✅ Improved MAUI workload setup
      - name: Install MAUI workloads
        run: |
          echo '{
            "sdk": {
              "version": "9.0.100",
              "rollForward": "latestFeature"
            }
          }' > ${{ env.PROJECT_PATH }}/global.json

          cd ${{ env.PROJECT_PATH }}
          dotnet workload config --update-mode workload-set
          dotnet workload restore
          dotnet workload install maui-ios
          dotnet workload list

      - name: Restore NuGet packages
        run: dotnet restore QrSortable.csproj
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k $KEYCHAIN_PATH

          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db
          security default-keychain -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS app (signed IPA)
        run: |
          dotnet publish QrSortable.csproj \
            -f ${{ env.TARGET_FRAMEWORK }} \
            -c ${{ env.CONFIGURATION }} \
            /p:BuildIpa=true \
            /p:ArchiveOnBuild=true \
            /p:EnableCodeSigning=true \
            /p:CodesignKey="${{ secrets.IOS_CODESIGN_KEY }}" \
            /p:CodesignProvision="${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}" \
            /p:RuntimeIdentifier=ios-arm64 \
            /p:SupportedOSPlatformVersion=16.0
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Locate IPA
        id: find_ipa
        run: |
          IPA_FILE=$(find ${{ env.PROJECT_PATH }}/bin -name "*.ipa" | head -n 1)

          if [ -z "$IPA_FILE" ]; then
            echo "❌ No IPA found"
            find ${{ env.PROJECT_PATH }}/bin
            exit 1
          fi

          echo "✅ Found IPA at: $IPA_FILE"
          echo "ipa_path=$IPA_FILE" >> $GITHUB_OUTPUT

      - name: Copy IPA to workspace
        run: |
          cp "${{ steps.find_ipa.outputs.ipa_path }}" ./QrSortable-Signed.ipa

      - name: Verify IPA
        run: |
          ls -lh QrSortable-Signed.ipa
          unzip -l QrSortable-Signed.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QrSortable-Signed-IPA
          path: QrSortable-Signed.ipa
          if-no-files-found: error
